name: OmiCourier
options:
  bundleIdPrefix: com.mk07
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  OmiCourier:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Omi Courier
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "7"
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: The app reads the audio from your Omi pendant.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mk07.omicourier
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
